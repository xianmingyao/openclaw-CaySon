[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jingmai-product-publish"
version = "1.0.0"
description = "京麦桌面商品上架自动化系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.52,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "pywinauto>=0.6.8,<1.0",
  "openpyxl>=3.1,<4.0",
  "Pillow>=10.0,<12.0",
  "requests>=2.31,<3.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
jingmai-publish = "jingmai_publish.cli:main"

[tool.setuptools.packages.find]
include = ["jingmai_publish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
